plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_file_name}-${project.name}-${minecraft_version_label}"
}

def includeDocs = providers.gradleProperty('withDocs')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    if (includeDocs) {
        withSourcesJar()
        withJavadocJar()
    }
}

tasks.withType(Javadoc).configureEach {
    enabled = includeDocs
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = "NeoForge"
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            excludeGroupAndSubgroups('net.minecraftforge')
        }
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    def configuration = configurations.findByName(variant)
    if (configuration == null) {
        return
    }
    configuration.outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

if (includeDocs) {
    sourcesJar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${mod_file_name}" }
        }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_file_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var packFormat = project.findProperty('resource_pack_format') ?: (minecraft_version.startsWith('26.') ? 82 : 64)
    var packFormatFields = minecraft_version.startsWith('26.')
            ? "\"min_format\": ${packFormat},\n        \"max_format\": ${packFormat}"
            : '"min_format": 64,\n        "max_format": 81,\n        "supported_formats": [64, 81]'

    var expandProps = [
            'version'                      : version,
            'mod_version'                  : "${version}+${minecraft_version_label}",
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_label'      : minecraft_version_label,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_version_range': fabric_minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_file_name'                : mod_file_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'neoforge_dependency_version_range': neoforge_dependency_version_range,
            'neoforge_minecraft_version_range': neoforge_minecraft_version_range,
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "forge_dependency_version_range": forge_dependency_version_range,
            "forge_minecraft_version_range": forge_minecraft_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'pack_format'                  : packFormat,
            'pack_format_fields'           : packFormatFields
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching('pack.mcmeta') {
        expand expandProps
    }

    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    eachFile {
        if (it.name.startsWith('immersivethunder') && it.name.endsWith('.mixins.json')) {
            it.name = it.name.replaceFirst('immersivethunder', mod_id)
        }
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = System.getenv('local_maven_url')
        }
    }
}
