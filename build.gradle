plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.15.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

def minecraftTarget = providers.gradleProperty('mc_target').orElse('1.21.x').get()
def minecraftTargetFile = file("gradle/minecraft-versions/${minecraftTarget}.properties")

if (!minecraftTargetFile.exists()) {
    throw new GradleException("Unknown mc_target '${minecraftTarget}'. Expected a file in gradle/minecraft-versions.")
}

def minecraftTargetProperties = new Properties()
minecraftTargetFile.withInputStream { minecraftTargetProperties.load(it) }

allprojects {
    minecraftTargetProperties.each { key, value ->
        ext.set(key.toString(), value.toString())
    }
}

def releaseDir = layout.buildDirectory.dir('release')
def minecraftTargets = fileTree('gradle/minecraft-versions') {
    include '*.properties'
}.files.collect { it.name - '.properties' }.sort()
def fabricReleaseTargets = ['1.21.x', '26.1.2', '26.2', '26.3'] as Set
def forgeOnlyReleaseTargets = ['26.1.1'] as Set

def loadersForTarget = { target ->
    forgeOnlyReleaseTargets.contains(target)
            ? ['forge']
            : fabricReleaseTargets.contains(target) ? ['fabric', 'forge', 'neoforge'] : ['forge', 'neoforge']
}

def currentLoaders = loadersForTarget(minecraftTarget)

tasks.register('cleanPackageOutputs', Delete) {
    group = 'build'
    description = 'Delete packaged loader jar outputs.'
    delete releaseDir
    delete subprojects.collect { subproject ->
        subproject.fileTree(subproject.layout.buildDirectory.dir('libs')) {
            include '*.jar'
        }
    }
}

tasks.register('packageMod') {
    group = 'build'
    description = "Build ${currentLoaders.join(', ')} jars for Minecraft ${minecraftTarget}."
    dependsOn currentLoaders.collect { ":${it}:build".toString() }
}

tasks.register('cleanPackage') {
    group = 'build'
    description = "Delete packaged jars and build ${currentLoaders.join(', ')} jars for Minecraft ${minecraftTarget}."
    dependsOn tasks.named('cleanPackageOutputs')
    dependsOn tasks.named('packageMod')
}

tasks.named('packageMod').configure {
    mustRunAfter tasks.named('cleanPackageOutputs')
}

def releaseBuildTasks = minecraftTargets.collect { target ->
    def taskSuffix = target.replaceAll(/[^A-Za-z0-9]/, '_')
    def loaders = loadersForTarget(target)
    def releaseTask = tasks.register("buildRelease${taskSuffix}", GradleBuild) {
        group = 'release'
        description = "Build ${loaders.join(', ')} jars for Minecraft ${target}."
        buildName = "ImmersiveThunder-${taskSuffix}"
        startParameter.projectProperties = new LinkedHashMap<>(gradle.startParameter.projectProperties) + [mc_target: target]
        tasks = loaders.collect { ":${it}:build".toString() }
    }
    tasks.register("buildRealese${taskSuffix}") {
        group = 'release'
        description = "Deprecated alias for buildRelease${taskSuffix}."
        dependsOn releaseTask
    }
    releaseTask
}

releaseBuildTasks.eachWithIndex { taskProvider, index ->
    taskProvider.configure {
        mustRunAfter project.tasks.named('cleanPackageOutputs')
        if (index > 0) {
            mustRunAfter releaseBuildTasks[index - 1]
        }
    }
}

tasks.register('packageRelease', Copy) {
    group = 'release'
    description = 'Build all release jars and copy them to build/release by loader.'
    dependsOn tasks.named('cleanPackageOutputs')
    dependsOn releaseBuildTasks
    ['fabric', 'forge', 'neoforge'].each { loader ->
        from(project(":${loader}").layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar'
            into loader
        }
    }
    into releaseDir
}

tasks.register('cleanRelease') {
    group = 'release'
    description = 'Delete build/release and loader jar outputs.'
    dependsOn tasks.named('cleanPackageOutputs')
}

tasks.register('cleanRealese') {
    group = 'release'
    description = 'Deprecated alias for cleanRelease.'
    dependsOn tasks.named('cleanRelease')
}

tasks.register('buildRealeseJars') {
    group = 'release'
    description = 'Deprecated alias for packageRelease.'
    dependsOn tasks.named('packageRelease')
}
